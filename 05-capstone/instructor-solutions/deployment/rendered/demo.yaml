apiVersion: v1
data:
  BACKGROUND_COLOR: '#e0f2fe'
kind: ConfigMap
metadata:
  name: frontend-theme
  namespace: capstone
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: capstone
spec:
  ports:
  - port: 8080
    targetPort: http
  selector:
    app: campus-api
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: capstone
spec:
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: campus-db
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: capstone
spec:
  ports:
  - port: 8080
    targetPort: http
  selector:
    app: campus-frontend
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    helm.sh/resource-policy: keep
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: db-data
  namespace: capstone
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: capstone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: campus-api
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: PGHOST
          value: db
        - name: PGDATABASE
          value: campus
        - name: PGUSER
          value: campus
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: db-credentials
        image: campus-api:v1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        name: api
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 3
        resources:
          limits:
            cpu: 250m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: capstone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-frontend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: campus-frontend
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: API_URL
          value: http://api:8080
        image: campus-frontend:v1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        name: frontend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 3
        resources:
          limits:
            cpu: 250m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        volumeMounts:
        - mountPath: /config
          name: theme
          readOnly: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: frontend-theme
        name: theme
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: capstone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-db
  serviceName: db
  template:
    metadata:
      labels:
        app: campus-db
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POSTGRES_DB
          value: campus
        - name: POSTGRES_USER
          value: campus
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: db-credentials
        image: postgres:16.6-bookworm
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - campus
            - -d
            - campus
          periodSeconds: 10
        name: postgres
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - campus
            - -d
            - campus
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          exec:
            command:
            - pg_isready
            - -U
            - campus
            - -d
            - campus
          failureThreshold: 40
          periodSeconds: 3
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: db-data
