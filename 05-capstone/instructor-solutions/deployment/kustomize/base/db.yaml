apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  clusterIP: None
  selector:
    app: campus-db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: campus-db
  template:
    metadata:
      labels:
        app: campus-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:16.6-bookworm
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: campus
        - name: POSTGRES_USER
          value: campus
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        volumeMounts:
        - name: data
          mountPath: "/var/lib/postgresql/data"
        startupProbe:
          exec:
            command: [pg_isready, -U, campus, -d, campus]
          periodSeconds: 3
          failureThreshold: 40
        readinessProbe:
          exec:
            command: [pg_isready, -U, campus, -d, campus]
          periodSeconds: 5
        livenessProbe:
          exec:
            command: [pg_isready, -U, campus, -d, campus]
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: db-data
