apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-frontend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: campus-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend
        image: campus-frontend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: API_URL
          value: http://api:8080
        volumeMounts:
        - name: theme
          mountPath: "/config"
          readOnly: true
        startupProbe:
          httpGet:
            path: "/healthz"
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: "/readyz"
            port: http
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: "/healthz"
            port: http
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: theme
        configMap:
          name: frontend-theme
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: campus-frontend
  ports:
  - port: 8080
    targetPort: http
