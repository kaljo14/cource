apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campus-board
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_OWNER/REPLACE_REPO.git
    targetRevision: main
    path: golang-app/05-capstone/instructor-solutions/deployment/helm/campus-board
  destination:
    server: https://kubernetes.default.svc
    namespace: capstone
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
