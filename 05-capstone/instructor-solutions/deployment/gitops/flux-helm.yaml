apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: campus-board
  namespace: flux-system
spec:
  interval: 30s
  timeout: 5m
  targetNamespace: capstone
  releaseName: campus-board
  chart:
    spec:
      chart: ./05-capstone/instructor-solutions/deployment/helm/campus-board
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: campus-board
      interval: 30s
  driftDetection:
    mode: enabled
