apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: course-prod
resources: [../../base, namespace.yaml]
replicas:
- name: go-app
  count: 2
configMapGenerator:
- name: app-config
  behavior: merge
  literals: [MESSAGE=Hello prod]
images:
- name: course-app
  newName: course-app
  newTag: v1
